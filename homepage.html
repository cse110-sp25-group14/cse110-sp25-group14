<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Benchmark</title>
  <!-- Link out to the separate style sheet -->
  <link rel="stylesheet" href="homepage.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Baloo" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Konkhmer+Sleokchher&family=Koulen&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Patua+One&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top banner -->
  <header class="banner">
    <h1>Human Benchmark</h1>
  </header>
  <main>
    <section class="intro">
      <h2 class="welcome">Welcome [user]!</h2>
      <p class="tagline">How sharp is your brain today
        <span class="question">?</span></p>
      <br> 
      <button id="lets-find-out-btn" class="primary-btn">let’s find out</button>
    </section>
    <!-- Game cards -->
    <section class="games">
      <!-- Matching card -->
      <article class="game-card">
        <h3 class="matching">Matching</h3>
        <div class="icon-board chicks">
          <!-- Little chick emoji placeholders; replace with images if you like -->
          <span>🐥</span><span>🐤</span><span>🐤</span>
          <span>🐤</span><span>🐥</span><span>🐤</span>
        </div>
        <div class="actions">
          <button id="matching-button" class="sec-btn">Play</button>
          <button id="matching-record" class="sec-btn ghost">Records</button>
        </div>
      </article>
      <!-- Sequence card -->
      <article class="game-card">
        <h3 class="sequence">Sequence</h3>
        <div class="icon-board">
          <div class="grid">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="actions">
          <button id="sequence-button" class="sec-btn">Play</button>
          <button id="sequence-record" class="sec-btn ghost">Records</button>
        </div>
      </article>
    </section>
  </main>
  <footer>
    <div class="footer-icon">
      <button id="leaderboard-btn" aria-label="Go to leaderboard">📊</button>
      <!-- <button id="leaderboard-btn" aria-label="Go to leaderboard"><img src="chart-simple-solid 1.svg" alt="leaderboard icon" width="40" height="40"></button> -->
    </div>
    <div class="toggle" id="theme-toggle"></div>
  </footer>
  <script src="./scripts/homepage.js"></script>
</body>
</html>
