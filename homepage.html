<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Benchmark</title>

  <!-- Link out to the separate style sheet -->
  <link rel="stylesheet" href="homepage.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  <link href='https://fonts.googleapis.com/css?family=Baloo' rel='stylesheet'>
</head>

<body>
  <!-- Top banner -->
  <header class="banner">
    <h1>Human Benchmark</h1>
  </header>

  <main>
    <section class="intro">
      <h2 class="welcome">Welcome [user]!</h2>

      <p class="tagline">How sharp is your brain today?</p>
      <br> 
      <button class="primary-btn">let’s find out</button>
    </section>

    <!-- Game cards -->
    <section class="games">
      <!-- Matching card -->
      <article class="game-card">
        <h3>Matching</h3>

        <div class="icon-board chicks">
          <!-- Little chick emoji placeholders; replace with images if you like -->
          <span>🐥</span><span>🐤</span><span>🐤</span>
          <span>🐤</span><span>🐥</span><span>🐤</span>
          <span>🐤</span><span>🐤</span><span>🐤</span>
        </div>

        <div class="actions">
          <button class="sec-btn">Play</button>
          <button class="sec-btn ghost">Records</button>
        </div>
      </article>

      <!-- Sequence card -->
      <article class="game-card">
        <h3>Sequence</h3>

        <div class="icon-board grid">
          <!-- 3 × 3 grid of squares -->
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="actions">
          <button class="sec-btn">Play</button>
          <button class="sec-btn ghost">Records</button>
        </div>
      </article>
    </section>
  </main>
  <footer>
    <div class="footer-icon">
      <button id="leaderboard-btn" aria-label="Go to leaderboard">📊</button>
    </div>
    
    <div class="toggle"></div>
  </footer>
</body>
</html>
