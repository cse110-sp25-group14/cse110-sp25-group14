<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Benchmark – Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Konkhmer+Sleokchher&family=Koulen&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Patua+One&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/result.css" />
  <script src="../scripts/result.js"></script>
</head>
<body>
  <div id="page-info">
    <img src="../assets/backarrow-blue.svg" alt="back arrow"/>
  </div>
  <main id="content" aria-label="Score summary">
    <div id="result-card">
        <div class="section">
            <h1 class="result">RESULT</h1>
            <h2 class="time">Time</h2>
            <h2 class="current-time">Current: 02:30</h2>
            <h2 class="record-time">Record: 01:01</h2>
        </div>
        <div class="section">
            <h2 class="moves">Moves</h2>
            <h2 class="current-moves">Current: 20</h2>
            <h2 class="current-record">Record: 19</h2>
        </div>
        <button class="play-again">Play Again</button>
    </div>
  </main>
  <footer>
    <div class="footer-icon">
      <button id="leaderboard-btn" aria-label="Go to leaderboard">
        <img id="trophy" src="../assets/trophy-solid.svg" alt="trophy"/>
      </button>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-icon sun">
        <img src="../assets/sun_display.svg" alt="Sun Icon" width="20" height="20" />
      </span>
      <span class="theme-icon moon">
        <img src="../assets/moon_display.svg" alt="Moon Icon" width="20" height="20" />
      </span>
    </button>
  </footer>
</body>
</html>
