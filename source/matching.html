<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Benchmark</title>
    <link rel="stylesheet" href="./styles/matching.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Baloo" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Konkhmer+Sleokchher&family=Koulen&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Patua+One&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
    <script type="module" src="../scripts/matching.js"></script>
</head>

<body>
    <main>
        <div id="page-info">
            <img src="../assets/backarrow-blue.svg" alt="black back arrow"/>
            <h1 id="matching-title">Matching</h1>
        </div>
        <button id="start-btn">Start Game</button>
        <div class="stats">
            <div class="stats-grid">
                <div class="row">
                    <p class="column">Time - <span id="stopwatch">00:00</span></p>
                    <p id="move-counter" class="column">Moves - 0</p>
                </div>
                <div class="row">
                    <p id="record-time"  class="column">Record Time - --:--</p>
                    <p id="record-moves" class="column">Record Moves - --</p>
                </div>
            </div>
        </div>

        <div id="card-grid">
            <div class="card-row">
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
            </div>
            <div class="card-row">
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="flower icon"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
            </div>
            <div class="card-row">
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
            </div>
            <div class="card-row">
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
                    <img class="card" src="../assets/G14.png" alt="G14 logo"/>
            </div>
        </div>
    </main>
    <footer>
        <div class="toggle" id="theme-toggle"></div>
      </footer>
      <script>
        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('click', () => {
          document.body.classList.toggle('dark');
        });
      </script>
</body>
</html>
