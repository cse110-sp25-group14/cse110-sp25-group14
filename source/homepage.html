<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Benchmark</title>
  <!-- Link out to the separate style sheet -->
  <link rel="stylesheet" href="./styles/homepage.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Baloo" rel="stylesheet">
  <script src="../scripts/homepage.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Konkhmer+Sleokchher&family=Koulen&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Patua+One&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top banner -->
  <header class="banner">
    <h1>Human Benchmark</h1>
    <!-- <h2 class="welcome">Welcome!</h2> -->
  </header>
  <main>
    <section class="intro">
      <p class="tagline">How sharp is your brain today
        <span class="question">?</span></p>
      <br> 
      <button class="primary-btn">Randomize Game</button>
    </section>
    <!-- Game cards -->
    <section class="games">
      <!-- Matching card -->
      <article class="game-card">
        <h3 class="matching">Matching</h3>
        <div class="matching-grid">
          <img src="../assets/orange.svg" alt="Orange" class="item">
          <img src="../assets/question.svg" alt="Question" class="item">
          <img src="../assets/question.svg" alt="Question" class="item">
          <img src="../assets/orange.svg" alt="Orange" class="item">
        </div>
        <div class="actions">
          <button id="matching-button" class="sec-btn">Play</button>
          <button id="matching-record" class="sec-btn ghost">Records</button>
        </div>
      </article>
      <!-- Sequence card -->
      <article class="game-card">
        <h3 class="sequence">Sequence</h3>
        <div class="icon-board">
          <div class="grid">
            <img src="../assets/blue.svg" alt="Blue Box" class="item">
            <img src="../assets/blue.svg" alt="Blue Box" class="item">
            <img src="../assets/orange-rec.svg" alt="Orange Box" class="item">
            <img src="../assets/blue.svg" alt="Blue Box" class="item">
          </div>
        </div>
        <div class="actions">
          <button id="sequence-button" class="sec-btn">Play</button>
          <button id="sequence-record" class="sec-btn ghost">Records</button>
        </div>
      </article>
    </section>
  </main>
  <footer>
    <div class="footer-icon">
      <button id="leaderboard-btn" aria-label="Go to leaderboard">
        <img id="trophy" src="/assets/trophy-solid.svg" alt="trophy"/>
      </button>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-icon sun">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="5" stroke="white" stroke-width="1.5"/>
          <g stroke="white" stroke-width="1.5" stroke-linecap="round">
            <path d="M12 3v2M12 19v2M21 12h-2M5 12H3M18.36 5.64l-1.41 1.41M7.05 16.95l-1.41 1.41M18.36 18.36l-1.41-1.41M7.05 7.05l-1.41-1.41"/>
          </g>
        </svg>
      </span>    
      <span class="theme-icon moon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 0 1 11.21 3a7 7 0 1 0 9.79 9.79Z"/>
        </svg>
      </span>
    </button>
  </footer>
  <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
  
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    });

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark');
    }
  </script>  
</body>
</html>
