<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Benchmark</title>
  <!-- Link out to the separate style sheet -->
  <link rel="stylesheet" href="result.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Baloo" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Konkhmer+Sleokchher&family=Koulen&family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Patua+One&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top banner -->
  <header class="stats-banner"> 
    <div class="back">
        <!-- <button id="back-btn" aria-label="Go back"><img src="Vector.svg" alt="back button"> </button> -->
    </div>
  </header>
  <main>
    <div id="result-card">
        <div class="section">
            <h1 class="result">RESULT</h1>
            <h2 class="time">Time</h2>
            <h2 class="current-time">Current: 02:30</h2>
            <h2 class="record-time">Record: 01:01</h2>
        </div>
        <div class="section">
            <h2 class="moves">Moves</h2>
            <h2 class="current-moves">Current: 20</h2>
            <h2 class="current-record">Record: 19</h2>
        </div>
        <button class="play-again">Play Again</button>
    </div>
  </main>
  <footer>
    <div class="footer-icon">
      <button id="leaderboard-btn" aria-label="Go to leaderboard">📊</button>
      <!-- <button id="leaderboard-btn" aria-label="Go to leaderboard"><img src="chart-simple-solid 1.svg" alt="leaderboard icon" width="40" height="40"></button> -->
    </div>
    <div class="toggle" id="themeToggle"></div>
  </footer>
  <script>
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
