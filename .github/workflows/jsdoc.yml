name: Build & Publish JSDoc

on: [push]
  

permissions:                  # let the workflow push to gh-pages
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                      # 1️⃣ code
      - uses: actions/setup-node@v4                    # 2️⃣ Node 20 + cache
        with:
          node-version: 20
          cache: npm
      - run: npm ci                                    # 3️⃣ deps
      - run: npm run docs                              # 4️⃣ build docs → ./docs

      # Publish ./docs to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4            # 5️⃣ deploy
        with:
          publish_dir: ./scripts/docs
          publish_branch: gh-pages
          commit_message: "docs: auto-deploy ${{ github.sha }}"