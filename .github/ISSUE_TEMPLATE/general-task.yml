name: General Task
description: Use this template for non-code assignments related to the project

body:
  - type: textarea
    id: task_summary
    attributes:
      label: Task Summary
      description: Brief description of the task and what it involves.
      placeholder: |
        Ex: Create wireframes for the login page on Figma.

  - type: textarea
    id: assignment
    attributes:
      label: Assignment Corresponding to Issue
      description: Type down or link to which assignment the issue is relevant to.
      placeholder: |
        Ex: Project Warm-up

  - type: textarea
    id: platform
    attributes:
      label: Relevant Platform
      description: Which platform will the task be done on (Provide a link to it if applicable)
      placeholder: |
        Ex: Figma: https://www.figma.com/...

  - type: textarea
    id: subtasks
    attributes:
      label: Checklist or Steps
      description: Optional – break the task into smaller steps.
      placeholder: |
        - Draft initial layout
        - Add interactions for buttons
        - Share with team for feedback

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Optional - Any background info, blockers, or decisions that might affect this task
      placeholder: |
        We're still waiting on instructions from the TA.
